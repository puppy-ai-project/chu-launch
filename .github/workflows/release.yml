name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "VERSION must be a semantic version such as 1.2.3" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag v$tag_version does not match VERSION file ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        env:
          CHU_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          CHU_ARCH=arm64 sh scripts/package-release.sh build/release
          CHU_ARCH=x86_64 sh scripts/package-release.sh build/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/release/Chu-Launchpad-"$VERSION"-mac-arm64.zip
          build/release/Chu-Launchpad-"$VERSION"-mac-arm64.dmg
          build/release/Chu-Launchpad-"$VERSION"-SHA256SUMS-arm64.txt
          build/release/Chu-Launchpad-"$VERSION"-mac-x64.zip
          build/release/Chu-Launchpad-"$VERSION"-mac-x64.dmg
          build/release/Chu-Launchpad-"$VERSION"-SHA256SUMS-x64.txt
          --title "Chu Launchpad $VERSION"
          --generate-notes
