name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        env:
          NOVA_VERSION: ${{ steps.version.outputs.version }}
          NOVA_BUILD_NUMBER: ${{ github.run_number }}
        run: sh scripts/package-release.sh build/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/release/Nova-Launchpad-"$VERSION"-mac.zip
          build/release/Nova-Launchpad-"$VERSION"-mac.dmg
          build/release/Nova-Launchpad-"$VERSION"-SHA256SUMS.txt
          --title "Nova Launchpad $VERSION"
          --generate-notes
